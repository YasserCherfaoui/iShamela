[project]
name = "ishamela-data"
version = "0.1.0"
description = "iShamela data pipeline: Hugging Face datasets to searchable SQLite bundles"
readme = "README.md"
authors = [
    { name = "Yasser Cherfaoui", email = "yasser.cherfaoui@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
