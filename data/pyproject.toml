[project]
name = "ishamela-data"
version = "0.1.0"
description = "iShamela data pipeline: Hugging Face datasets to searchable SQLite bundles"
readme = "README.md"
authors = [
    { name = "Yasser Cherfaoui", email = "yasser.cherfaoui@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "huggingface-hub>=1.32.0",
    "jsonschema>=4.26.0",
    "polars>=1.44.2",
    "zstandard>=0.25.0",
]

[project.scripts]
ishamela-build = "ishamela_data.cli:main"
ishamela-catalog = "ishamela_data.catalog_cli:main"
ishamela-publish = "ishamela_data.publish_cli:main"

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: hits Hugging Face (set ISHAMELA_HF=1 to enable)",
]
