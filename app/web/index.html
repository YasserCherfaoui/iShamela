  <style id="splash-screen-style">
    html {
      height: 100%
    }

    body {
      margin: 0;
      min-height: 100%;
      background-color: #0E3B30;
          background-size: 100% 100%;
    }

    .center {
      margin: 0;
      position: absolute;
      top: 50%;
      left: 50%;
      -ms-transform: translate(-50%, -50%);
      transform: translate(-50%, -50%);
    }

    .contain {
      display:block;
      width:100%; height:100%;
      object-fit: contain;
    }

    .stretch {
      display:block;
      width:100%; height:100%;
    }

    .cover {
      display:block;
      width:100%; height:100%;
      object-fit: cover;
    }

    .bottom {
      position: absolute;
      bottom: 0;
      left: 50%;
      -ms-transform: translate(-50%, 0);
      transform: translate(-50%, 0);
    }

    .bottomLeft {
      position: absolute;
      bottom: 0;
      left: 0;
    }

    .bottomRight {
      position: absolute;
      bottom: 0;
      right: 0;
    }
  </style>
  <script id="splash-screen-script">
    function removeSplashFromWeb() {
      document.getElementById("splash")?.remove();
      document.getElementById("splash-branding")?.remove();

<body>
  <picture id="splash">
      <source srcset="splash/img/light-1x.png 1x, splash/img/light-2x.png 2x, splash/img/light-3x.png 3x, splash/img/light-4x.png 4x" media="(prefers-color-scheme: light)">
      <source srcset="splash/img/dark-1x.png 1x, splash/img/dark-2x.png 2x, splash/img/dark-3x.png 3x, splash/img/dark-4x.png 4x" media="(prefers-color-scheme: dark)">
      <img class="center" aria-hidden="true" src="splash/img/light-1x.png" alt="">
  </picture>
  
  <script>
    (function () {
      function loadBootstrap() {
        var script = document.createElement('script');
        script.src = 'flutter_bootstrap.js';
        script.async = true;
        document.body.appendChild(script);
      }
      var meta = document.querySelector('meta[name="ishamela-build-id"]');
      var id = meta ? (meta.getAttribute('content') || '') : '';
      if (!id || id.indexOf('__ISHAMELA_BUILD_ID__') !== -1) {
        loadBootstrap();
        return;
      }
      var seen;
      try {
        seen = localStorage.getItem('ishamela-build-id');
      } catch (e) {
        loadBootstrap();
        return;
      }
      if (seen === id) {
        loadBootstrap();
        return;
      }
      try {
        localStorage.setItem('ishamela-build-id', id);
      } catch (e) {
        loadBootstrap();
        return;
      }
      if (!navigator.serviceWorker || !navigator.serviceWorker.controller) {
        loadBootstrap();
        return;
      }
      Promise.all([
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          return Promise.all(regs.map(function (reg) { return reg.unregister(); }));
        }),
        (window.caches ? caches.keys() : Promise.resolve([])).then(function (keys) {
          return Promise.all(keys.filter(function (key) {
            return key.indexOf('flutter-') === 0;
          }).map(function (key) { return caches.delete(key); }));
        })
      ]).then(function () {
        try {
          if (sessionStorage.getItem('ishamela-shell-reloaded') === id) {
            loadBootstrap();
            return;
          }
          sessionStorage.setItem('ishamela-shell-reloaded', id);
        } catch (e) {
          loadBootstrap();
          return;
        }
        location.reload();
      }).catch(function () {
        loadBootstrap();
      });
    })();
  </script>
