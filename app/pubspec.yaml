name: ishamela
description: iShamela — offline Islamic library reader
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.2
  sqlite3: ^2.9.4
  sqlite3_flutter_libs: ^0.5.42
  dio: ^5.11.1
  path_provider: ^2.1.5
  crypto: ^3.0.7
  intl: ^0.20.2
  ffi: ^2.2.0
  zstandard: ^1.5.0
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/catalog/catalog.sqlite.zst
    - assets/catalog/catalog.json
  fonts:
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
        - asset: assets/fonts/Amiri-Bold.ttf
          weight: 700
    - family: ScheherazadeNew
      fonts:
        - asset: assets/fonts/ScheherazadeNew-Regular.ttf
        - asset: assets/fonts/ScheherazadeNew-Bold.ttf
          weight: 700
